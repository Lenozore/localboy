name: localboy_driver_app
description: Local Boy Driver & Guide App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.2
  google_fonts: ^8.0.0

  # State Management
  provider: ^6.1.1

  # HTTP & API
  dio: ^5.4.0

  # Storage
  shared_preferences: ^2.2.2

  # Maps (OpenStreetMap - Free)
  flutter_map: ^6.1.0

  # Location
  geolocator: ^14.0.2

  # Images
  cached_network_image: ^3.3.0

  # Date/Time
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
