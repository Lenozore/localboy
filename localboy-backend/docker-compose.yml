services:
  postgres:
    image: postgres:15-alpine
    container_name: localboy-db
    environment:
      POSTGRES_USER: localboy
      POSTGRES_PASSWORD: localboy123
      POSTGRES_DB: localboy_mvp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: